<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Рома</title>
<style>
/* Оформление кабинета. Палитра и типографика — те же, что в листах занятий
   и ДЗ (файлы в students, папки lessons и homework): менять здесь, а не
   в сборщике. Файл вставляется в страницу инлайном, внешних ссылок и
   шрифтов нет.
   Внимание: внутри этого комментария не должно быть последовательности
   «звёздочка + слэш» — она закрывает комментарий раньше времени и роняет
   все стили ниже. Пути пишем словами. */

:root{
  --page:#eceeea; --paper:#fbfbf8; --ink:#202a2c; --muted:#57656a;
  --accent:#0e6b66; --accent-ink:#0a4f4b; --accent-soft:#e1efee;
  --warn:#a86617; --warn-ink:#8a5312; --warn-soft:#f8edda;
  --good:#2f7d4f; --good-soft:#e3f0e7;
  --stop-soft:#fdf1f0; --stop-ink:#9c4b43;
  --rule:#dfe3df; --mark:#ffe7a1;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);
  font-size:clamp(16px,4.2vw,18px);line-height:1.6;-webkit-font-smoothing:antialiased;}
.sheet{max-width:760px;margin:1.4rem auto;background:var(--paper);
  border:1px solid var(--rule);border-radius:14px;
  box-shadow:0 10px 30px rgba(20,40,40,.08);padding:clamp(1.2rem,5vw,2.4rem);}

.head{border-bottom:2px solid var(--ink);padding-bottom:.9rem;margin-bottom:1.2rem;}
.lesson-no{font-family:var(--serif);font-size:clamp(1.4rem,6vw,2rem);font-weight:700;margin:0;}
.topic{margin:.5rem 0 0;font-size:1.02rem;}
.kicker{display:inline-block;margin:.8rem 0 0;font-size:.8rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-ink);font-weight:600;}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 .18em;}

a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:2px;}

.nav{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.2rem;}
.nav a{display:inline-block;padding:.4rem .9rem;border:1px solid var(--rule);
  border-radius:999px;background:#fff;text-decoration:none;font-size:.9rem;font-weight:600;}
.nav a.on{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;}

.intro{background:var(--accent-soft);border-radius:10px;padding:.85rem 1.1rem;
  margin-bottom:1.2rem;font-size:.95rem;color:var(--accent-ink);}

.blk-head{font-family:var(--serif);font-size:1.15rem;color:var(--accent-ink);
  margin:2rem 0 .1rem;padding-bottom:.35rem;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;}
.blk-head .tag{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-family:var(--sans);}
.blk-sub{color:var(--muted);font-size:.86rem;margin:.35rem 0 .2rem;}

/* Лента занятий и ДЗ */
.item{border:1px solid var(--rule);border-radius:12px;background:#fff;
  padding:.9rem 1.15rem;margin:.9rem 0;}
.item-head{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;}
.item-date{font-family:var(--serif);font-weight:700;font-size:1.12rem;color:var(--accent-ink);}
.item-kind{color:var(--muted);font-size:.9rem;}
.item-topic{margin:.45rem 0 .5rem;font-size:1rem;}
.links{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem;}
.links a{display:inline-block;padding:.35rem .8rem;border-radius:8px;
  background:var(--accent-soft);text-decoration:none;font-size:.9rem;font-weight:600;}
.links a.hw{background:var(--warn-soft);color:var(--warn-ink);}

.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;
  font-size:.74rem;letter-spacing:.03em;text-transform:uppercase;font-weight:700;}
.badge.wait{background:var(--warn-soft);color:var(--warn-ink);}
.badge.done{background:var(--good-soft);color:var(--good);}
.badge.new{background:var(--accent-soft);color:var(--accent-ink);}
.badge.sent{background:#e6e9f5;color:#3d4a86;}

/* Кнопка «Сдать домашнюю работу» и отметка о сдаче */
.links a.send{background:var(--accent-ink);color:#fff;}
.send-hint{color:var(--muted);font-size:.84rem;margin:.45rem 0 0;}
.submitted{background:#eef0f8;border-left:3px solid #3d4a86;border-radius:0 8px 8px 0;
  padding:.7rem .95rem;margin:.7rem 0 .2rem;font-size:.93rem;color:#3d4a86;}
.submitted .links{margin-top:.5rem;}
.submitted .links a.send{background:#fff;color:#3d4a86;border:1px solid #c3cae6;}

/* Переключатель «по датам / по темам».
   Сделан на радиокнопках и CSS, без JavaScript: страница ученика приходит
   зашифрованной и разворачивается уже в браузере, и скрипты внутри неё
   запускаются не во всех случаях. CSS работает всегда. */
.switch{display:none;}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.2rem 0 .2rem;}
.tabs label{display:inline-block;padding:.4rem .9rem;border:1px solid var(--rule);
  border-radius:999px;background:#fff;font-size:.9rem;font-weight:600;cursor:pointer;
  color:var(--accent-ink);user-select:none;}
.tabs label:hover{border-color:var(--accent);}
#by-date:checked ~ .tabs label[for="by-date"],
#by-topic:checked ~ .tabs label[for="by-topic"]{
  background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;}
.view{display:none;}
#by-date:checked ~ .view-date,
#by-topic:checked ~ .view-topic{display:block;}

.group{margin:1.6rem 0 0;}
.group-head{font-family:var(--serif);font-size:1.12rem;color:var(--accent-ink);
  margin:0 0 .2rem;padding-bottom:.3rem;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap;}
.group-head .count{font-family:var(--sans);font-size:.78rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);font-weight:600;}

/* Прогресс */
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:.9rem 0 .4rem;
  border:1px solid var(--rule);background:#fff;}
.bar span{display:block;}
.bar .s-learned{background:var(--good);}
.bar .s-first{background:#7ab98f;}
.bar .s-progress{background:var(--warn);}
.bar .s-not{background:#d8ddd8;}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-bottom:1rem;}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.35rem;
  vertical-align:baseline;}

/* Раздел на странице прогресса: заголовок, процент, полоса */
.sec{border:1px solid var(--rule);border-radius:12px;background:#fff;
  padding:1rem 1.15rem;margin:1rem 0;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:.6rem;flex-wrap:wrap;}
.sec-title{font-family:var(--serif);font-size:1.14rem;font-weight:700;color:var(--ink);}
.sec-pct{font-family:var(--serif);font-size:1.6rem;font-weight:700;color:var(--accent-ink);
  line-height:1;}
.sec-bar{height:10px;border-radius:999px;background:#e7eae7;overflow:hidden;margin:.65rem 0 .5rem;}
.sec-bar span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#7ab98f,var(--good));}
.sec-meta{color:var(--muted);font-size:.86rem;}
.sec details{margin-top:.6rem;}
.sec summary{cursor:pointer;list-style:none;color:var(--accent-ink);font-weight:600;
  font-size:.88rem;padding:.35rem 0;display:flex;align-items:center;gap:.5rem;}
.sec summary::-webkit-details-marker{display:none;}
.sec summary::before{content:"+";display:inline-grid;place-items:center;
  width:1.2rem;height:1.2rem;border-radius:50%;border:1.5px solid var(--accent);
  color:var(--accent);font-weight:700;font-size:.9rem;flex:none;}
.sec details[open] summary::before{content:"\2013";}

/* Учительский кабинет: карточка ученика */
.pupil{border:1px solid var(--rule);border-radius:12px;background:#fff;
  padding:1rem 1.15rem;margin:1rem 0;}
.pupil-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:.6rem;flex-wrap:wrap;}
.pupil-name{font-family:var(--serif);font-size:1.2rem;font-weight:700;}
.pupil-goal{color:var(--muted);font-size:.88rem;margin:.35rem 0 .1rem;}
.pupil-facts{display:flex;gap:1.3rem;flex-wrap:wrap;margin:.7rem 0 .2rem;}
.pupil-facts div{font-size:.84rem;color:var(--muted);}
.pupil-facts b{display:block;font-family:var(--serif);font-size:1.25rem;
  color:var(--ink);line-height:1.25;}
.pupil-facts b.warn{color:var(--warn-ink);}
.creds{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
  background:var(--warn-soft);border-radius:8px;padding:.5rem .8rem;
  margin:.7rem 0 .2rem;font-size:.86rem;color:var(--warn-ink);}
.creds code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  background:#fff;border:1px solid #e8d7b8;border-radius:6px;padding:.12rem .45rem;
  font-size:.92em;user-select:all;}

/* Итог сверху страницы прогресса */
.total{background:var(--accent-soft);border-radius:12px;padding:1.1rem 1.25rem;margin:1.2rem 0;}
.total-pct{font-family:var(--serif);font-size:2.6rem;font-weight:700;color:var(--accent-ink);
  line-height:1;}
.total-what{color:var(--accent-ink);font-size:.95rem;margin:.3rem 0 0;}
.total-bar{height:12px;border-radius:999px;background:#fff;overflow:hidden;margin:.8rem 0 .5rem;}
.total-bar span{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#7ab98f,var(--good));}

.node{border:1px solid var(--rule);border-left-width:4px;border-radius:0 10px 10px 0;
  background:#fff;padding:.75rem 1.05rem;margin:.6rem 0;}
.node.learned{border-left-color:var(--good);}
.node.first_success{border-left-color:#7ab98f;}
.node.in_progress{border-left-color:var(--warn);}
.node.not_started{border-left-color:#c9cfc9;}
.node-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;}
.node-title{font-weight:600;}
.node-what{color:var(--muted);font-size:.86rem;margin:.3rem 0 0;}
.node-what ul{margin:.3rem 0 0;padding-left:1.1rem;}

/* Три условия правила 9 — компактной строкой, а не повторяющимся списком */
.conds{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 0;}
.cond{font-size:.78rem;padding:.2rem .6rem;border-radius:999px;border:1px solid var(--rule);
  color:var(--muted);background:#fff;white-space:nowrap;}
.cond.yes{border-color:#a8d0b6;background:var(--good-soft);color:var(--good);font-weight:600;}
.cond.yes::before{content:"\2713\00a0";}
.cond.no::before{content:"\00b7\00a0";}

.stat{display:flex;gap:1.4rem;flex-wrap:wrap;margin:.6rem 0 0;}
.stat div{font-size:.9rem;color:var(--muted);}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--ink);line-height:1.2;}

.odz{display:flex;gap:.6rem;align-items:flex-start;background:var(--good-soft);
  border-radius:10px;padding:.85rem 1.05rem;margin-top:1.4rem;font-size:.95rem;}
.note-empty{background:var(--warn-soft);border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;padding:.75rem 1.05rem;color:var(--warn-ink);font-size:.93rem;}
.foot{margin-top:1.4rem;padding-top:.9rem;border-top:1px solid var(--rule);
  color:var(--muted);font-size:.82rem;}
@media print{body{background:#fff;} .sheet{box-shadow:none;border:none;margin:0;max-width:none;}}

.lock{max-width:420px;margin:15vh auto;}
.lock form{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;}
.lock input{flex:1 1 12rem;font:inherit;padding:.6rem .9rem;border:1px solid var(--rule);
  border-radius:10px;background:#fff;color:var(--ink);}
.lock input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.lock button{font:inherit;font-weight:600;padding:.6rem 1.2rem;border:0;border-radius:10px;
  background:var(--accent-ink);color:#fff;cursor:pointer;}
.lock .err{color:var(--stop-ink);font-size:.92rem;margin:.7rem 0 0;min-height:1.3em;}
</style>
</head>
<body>
<div class="sheet lock">
  <header class="head">
    <p class="lesson-no">Рома</p>
    <p class="topic">Страница защищена паролем</p>
    <span class="kicker">личный кабинет</span>
  </header>
  <p class="blk-sub">Пароль выдаёт преподаватель. Вводить его нужно один раз —
  дальше страница будет открываться сама.</p>
  <form id="f" autocomplete="off">
    <input id="p" type="password" placeholder="пароль" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit">Открыть</button>
  </form>
  <p class="err" id="e"></p>
</div>

  var STORE = "tutor-key-" + D.who;
  var form = document.getElementById("f");
  var field = document.getElementById("p");
  var note = document.getElementById("e");

  function bytes(b64){
    var raw = atob(b64), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    note.textContent = "Эта страница открывается только по ссылке сайта, " +
      "не как файл на устройстве. Откройте ссылку, которую дал преподаватель.";
    form.style.display = "none";
    return;
  }

  function unlock(password, quiet){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function(material){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:bytes(D.salt), iterations:D.rounds, hash:"SHA-256"},
          material, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      })
      .then(function(key){
        return crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(D.iv)}, key, bytes(D.data));
      })
      .then(function(plain){
        try { localStorage.setItem(STORE, password); } catch (e) {}
        var page = new TextDecoder().decode(plain);
        // Учительская сводка несёт внутри себя ключи от кабинетов учениц.
        // Раскрыв её своим паролем, преподаватель получает доступ ко всем
        // страницам сразу — дальше они открываются сами, без ввода пароля
        // на каждой. Ключи лежат ВНУТРИ шифротекста, поэтому до ввода
        // учительского пароля их в файле нет.
        try {
          var found = page.match(
            /<script type="application\/json" id="tutor-keys">([\s\S]*?)<\/script>/);
          if (found) {
            var keys = JSON.parse(found[1]);
            for (var slug in keys) {
              localStorage.setItem("tutor-key-" + slug, keys[slug]);
            }
          }
        } catch (e) {}
        document.open(); document.write(page); document.close();
      })
      .catch(function(){
        if (!quiet) {
          note.textContent = "Пароль не подошёл. Проверьте раскладку и регистр.";
          field.value = "";
          field.focus();
        } else {
          try { localStorage.removeItem(STORE); } catch (e) {}
        }
      });
  }

  form.addEventListener("submit", function(event){
    event.preventDefault();
    note.textContent = "Открываю…";
    unlock(field.value, false);
  });

  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) { unlock(saved, true); } else { field.focus(); }
})();
